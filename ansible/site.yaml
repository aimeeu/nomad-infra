---
# Main playbook to configure the entire Nomad cluster

- name: Configure all hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Display host information
      ansible.builtin.debug:
        msg: "Configuring {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] | default('IP pending') }})"
    - name: Display Ansible distribution
      ansible.builtin.debug:
        msg: "Ansible distribution: {{ ansible_facts['distribution'] }}"
    - name: Allow 'ubuntu' user to have passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ubuntu_sudo
        line: 'ubuntu ALL=(ALL) NOPASSWD:ALL'
        state: present
        mode: '0440'
        create: true
        validate: '/usr/sbin/visudo -cf %s'

- name: Test Ansible connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping all hosts
      ansible.builtin.ping:
      register: ping_result

    - name: Show ping result
      ansible.builtin.debug:
        var: ping_result

- name: Import Nomad server playbook
  ansible.builtin.import_playbook: nomad_servers.yaml

- name: Import Nomad client playbook
  ansible.builtin.import_playbook: nomad_clients.yaml

#- name: Bootstrap Nomad ACL
  #ansible.builtin.import_playbook: nomad_acl_bootstrap.yaml

- name: Cluster status summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Nomad Cluster Configuration Complete!"
          - "=========================================="
          - ""
          - "Servers configured: {{ groups['servers'] | length }}"
          - "Clients configured: {{ groups['clients'] | length }}"
          - ""
          - "SSH Access to Servers:"
          - "{% for host in groups['servers'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host].ansible_host }}  # {{ host }}{% endfor %}"
          - ""
          - "SSH Access to Clients:"
          - "{% for host in groups['clients'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host].ansible_host }}  # {{ host }}{% endfor %}"
          - ""
          - "Access Nomad UI at:"
          - "{% for host in groups['servers'] %}  http://{{ hostvars[host].ansible_host }}:4646{% endfor %}"
          - ""
          - "Next steps:"
          - "  1. Bootstrap ACLs: ansible-playbook nomad_acl_bootstrap.yaml"
          - "  2. SSH to a server and verify cluster: nomad server members"
          - "  3. Check nodes: nomad node status"
          - "  4. Deploy a test job: nomad job run example.nomad"
