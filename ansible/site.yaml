---
# Main playbook to configure the entire Nomad cluster

- name: Configure all hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Display host information
      ansible.builtin.debug:
        msg: "Configuring {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] | default('IP pending') }})"
    - name: Display Ansible distribution
      ansible.builtin.debug:
        msg: "Ansible distribution: {{ ansible_facts['distribution'] }}"
    - name: Allow 'ubuntu' user to have passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/ubuntu_sudo
        line: 'ubuntu ALL=(ALL) NOPASSWD:ALL'
        state: present
        mode: '0440'
        create: true
        validate: '/usr/sbin/visudo -cf %s'

- name: Test Ansible connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping all hosts
      ansible.builtin.ping:
      register: ping_result

    - name: Show ping result
      ansible.builtin.debug:
        var: ping_result

- name: Import Consul server playbook
  ansible.builtin.import_playbook: consul_servers.yaml

- name: Import Consul client playbook
  ansible.builtin.import_playbook: consul_clients.yaml

# Bootstrap Consul ACL (requires consul_acl_enabled: true in consul role vars)
- name: Bootstrap Consul ACL
  ansible.builtin.import_playbook: consul_acl_bootstrap.yaml

# Run after Consul agents are running on all nodes:
- name: Configure dnsmasq for Consul DNS forwarding
  ansible.builtin.import_playbook: dnsmasq.yaml

- name: Import Nomad server playbook
  ansible.builtin.import_playbook: nomad_servers.yaml

- name: Import Nomad client playbook
  ansible.builtin.import_playbook: nomad_clients.yaml

- name: Bootstrap Nomad ACL
  ansible.builtin.import_playbook: nomad_acl_bootstrap.yaml

# Run after Consul ACL bootstrap and Nomad are deployed:
- name: Consul-Nomad integration (ACL policies, tokens, workload identities)
  ansible.builtin.import_playbook: consul_nomad_integration.yaml

- name: Cluster status summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Display cluster access tokens
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Cluster Access Tokens"
          - "=========================================="
          - ""
          - "Consul bootstrap token:"
          - "  {{ lookup('file', playbook_dir + '/consul-bootstrap-secret-id.txt', errors='ignore') or '(not found — run consul_acl_bootstrap.yaml)' }}"
          - ""
          - "Nomad bootstrap token:"
          - "  {{ lookup('file', playbook_dir + '/nomad-bootstrap-secret-id.txt', errors='ignore') or '(not found — run nomad_acl_bootstrap.yaml)' }}"
          - ""
          - "Nomad server agent -> Consul token:"
          - "  {{ lookup('file', playbook_dir + '/nomad-consul-server-secret-id.txt', errors='ignore') or '(not found — run consul_nomad_service_discovery.yaml)' }}"
          - ""
          - "Nomad client agent -> Consul token:"
          - "  {{ lookup('file', playbook_dir + '/nomad-consul-client-secret-id.txt', errors='ignore') or '(not found — run consul_nomad_service_discovery.yaml)' }}"

    - name: Display completion message
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Nomad + Consul Cluster Configuration Complete!"
          - "=========================================="
          - ""
          - "Servers configured: {{ groups['servers'] | length }}"
          - "Clients configured: {{ groups['clients'] | length }}"
          - ""
          - "SSH Access to Servers:"
          - "{% for host in groups['servers'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host].ansible_host }}  # {{ host }}{% endfor %}"
          - ""
          - "SSH Access to Clients:"
          - "{% for host in groups['clients'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host].ansible_host }}  # {{ host }}{% endfor %}"
          - ""
          - "Access Nomad UI at:"
          - "{% for host in groups['servers'] %}  http://{{ hostvars[host].ansible_host }}:4646{% endfor %}"
          - ""
          - "Access Consul UI at:"
          - "{% for host in groups['servers'] %}  http://{{ hostvars[host].ansible_host }}:8500/ui{% endfor %}"
          - ""
          - "Next steps:"
          - "  1. SSH to a server and verify Nomad cluster: nomad server members"
          - "  2. Verify Consul cluster: consul members"
          - "  3. Check nodes: nomad node status"
          - "  4. Deploy a test job: nomad job run example.nomad"
