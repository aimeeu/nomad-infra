---
# Playbook to configure Nomad clients

- name: Configure Nomad clients
  hosts: clients
  become: true
  
  vars:
    nomad_server_enabled: false
    nomad_client_enabled: true
    nomad_cloud_auto_join_enabled: true
    nomad_cloud_auto_join_tag_key: "Role"
    nomad_cloud_auto_join_tag_value: "server"
    nomad_acl_enabled: false
    nomad_log_level: "INFO"
    nomad_enable_debug: false

  pre_tasks:
    - name: Generate TLS certificates
      ansible.builtin.include_role:
        name: tls
      vars:
        tls_self_signed_generate:
          - agent-name: "{{ inventory_hostname }}"
            ip: "{{ ansible_default_ipv4.address }}"
            dns: "{{ inventory_hostname }}"
      run_once: true
      delegate_to: localhost

  roles:
    - role: common
      vars:
        common_hostname: "{{ inventory_hostname }}"
    
    - role: cni
      when: ansible_distribution == "Ubuntu"
    
    - role: geerlingguy.docker
      become: true
      vars:
        docker_users:
          - "{{ ansible_user }}"
    
    - role: helper
      vars:
        helper_apt_packages:
          - jq
          - net-tools
          - unzip
          - build-essential
          - git
        helper_file_write_content:
          - content: "bridge"
            dst: "/etc/modules-load.d/nomad.conf"
            mode: "0644"
        helper_file_copy_local:
          - src: "{{ playbook_dir }}/../.tls/ca.pem"
            dst: "/etc/nomad.d/.tls/ca.crt"
            mode: "0644"
          - src: "{{ playbook_dir }}/../.tls/{{ inventory_hostname }}.pem"
            dst: "/etc/nomad.d/.tls/nomad.crt"
            mode: "0644"
          - src: "{{ playbook_dir }}/../.tls/{{ inventory_hostname }}-key.pem"
            dst: "/etc/nomad.d/.tls/nomad.key"
            mode: "0600"
    
    - role: nomad

  post_tasks:
    - name: Wait for Nomad to be ready
      ansible.builtin.wait_for:
        port: 4646
        delay: 5
        timeout: 60

    - name: Display Nomad node status
      ansible.builtin.command: nomad node status
      register: nomad_node_status
      changed_when: false
      failed_when: false

    - name: Show Nomad node status
      ansible.builtin.debug:
        var: nomad_node_status.stdout_lines
      when: nomad_node_status.rc == 0

