---
# Playbook: deploy_consul_nomad_wi.yaml
#
# Deploys a Consul cluster and a Nomad cluster integrated for service discovery
# and workload identity:
#   1. Configures all hosts
#   2. Tests Ansible connectivity
#   3. Deploys Consul servers and clients
#   4. Bootstraps Consul ACL
#   5. Configures dnsmasq for Consul DNS forwarding
#   6. Deploys Nomad servers and clients
#   7. Bootstraps Nomad ACL
#   8. Configures Consul-Nomad service discovery (ACL policies and agent tokens)
#   9. Configures Consul-Nomad workload identity (JWT auth method, binding rules,
#      and service_identity/task_identity blocks in Nomad server config)
#
# With workload identity, Nomad workloads exchange a short-lived JWT for a
# scoped Consul ACL token automatically. No static secrets are required in job
# specs or Nomad agent configuration.
#
# To run service discovery only (no workload identity), use
# deploy_consul_nomad_sd.yaml instead.
#
# Usage:
#   ansible-playbook -i inventory.ini deploy_consul_nomad_wi.yaml
#
# Set environment variables after deployment:
#   source ./set-cluster-env.sh
#   source ./unset-cluster-env.sh   # to unset

# ── Configure all hosts ───────────────────────────────────────────────────────

- name: Configure all hosts
  hosts: all
  gather_facts: true
  tasks:
  - name: Display host information
    ansible.builtin.debug:
      msg: "Configuring {{ inventory_hostname }} ({{ ansible_facts['default_ipv4']['address'] | default('IP pending') }})"

  - name: Display Ansible distribution
    ansible.builtin.debug:
      msg: "Ansible distribution: {{ ansible_facts['distribution'] }}"

  - name: Allow 'ubuntu' user to have passwordless sudo
    ansible.builtin.lineinfile:
      path: /etc/sudoers.d/ubuntu_sudo
      line: 'ubuntu ALL=(ALL) NOPASSWD:ALL'
      state: present
      mode: '0440'
      create: true
      validate: '/usr/sbin/visudo -cf %s'

# ── Test Ansible connectivity ─────────────────────────────────────────────────

- name: Test Ansible connectivity
  hosts: all
  gather_facts: false
  tasks:
  - name: Ping all hosts
    ansible.builtin.ping:
    register: ping_result

  - name: Show ping result
    ansible.builtin.debug:
      var: ping_result

# ── Deploy Consul ─────────────────────────────────────────────────────────────

- name: Import Consul server playbook
  ansible.builtin.import_playbook: consul_servers.yaml

- name: Import Consul client playbook
  ansible.builtin.import_playbook: consul_clients.yaml

- name: Bootstrap Consul ACL
  ansible.builtin.import_playbook: consul_acl_bootstrap.yaml

- name: Configure dnsmasq for Consul DNS forwarding
  ansible.builtin.import_playbook: dnsmasq.yaml

# ── Deploy Nomad ──────────────────────────────────────────────────────────────

- name: Import Nomad server playbook
  ansible.builtin.import_playbook: nomad_servers.yaml

- name: Import Nomad client playbook
  ansible.builtin.import_playbook: nomad_clients.yaml

- name: Bootstrap Nomad ACL
  ansible.builtin.import_playbook: nomad_acl_bootstrap.yaml

# ── Consul-Nomad integration ──────────────────────────────────────────────────

# Phase 1: Consul ACL policies and agent tokens
- name: Configure Consul-Nomad service discovery
  ansible.builtin.import_playbook: consul_nomad_service_discovery.yaml

# Phase 2: JWT auth method and workload identity blocks
- name: Configure Consul-Nomad workload identity
  ansible.builtin.import_playbook: consul_nomad_workload_identity.yaml

# ── Cluster status summary ────────────────────────────────────────────────────

- name: Consul and Nomad cluster status summary
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
  - name: Display cluster access tokens
    ansible.builtin.debug:
      msg:
      - "=========================================="
      - "Cluster Access Tokens"
      - "=========================================="
      - ""
      - "Consul bootstrap token:"
      - "  {{ lookup('file', playbook_dir + '/consul-bootstrap-secret-id.txt', errors='ignore') or '(not found — run consul_acl_bootstrap.yaml)' }}"
      - ""
      - "Nomad bootstrap token:"
      - "  {{ lookup('file', playbook_dir + '/nomad-bootstrap-secret-id.txt', errors='ignore') or '(not found — run nomad_acl_bootstrap.yaml)' }}"
      - ""
      - "Nomad server agent -> Consul token:"
      - "  {{ lookup('file', playbook_dir + '/nomad-consul-server-secret-id.txt', errors='ignore') or '(not found — run consul_nomad_service_discovery.yaml)' }}"
      - ""
      - "Nomad client agent -> Consul token:"
      - "  {{ lookup('file', playbook_dir + '/nomad-consul-client-secret-id.txt', errors='ignore') or '(not found — run consul_nomad_service_discovery.yaml)' }}"

  - name: Display environment variable export instructions
    ansible.builtin.debug:
      msg:
      - "=========================================="
      - "Environment Variables"
      - "=========================================="
      - ""
      - "Run the following to set environment variables in your terminal:"
      - ""
      - "  export CONSUL_HTTP_ADDR=http://{{ hostvars[groups['servers'][0]]['ansible_host'] }}:8500"
      - "  export CONSUL_HTTP_TOKEN={{ lookup('file', playbook_dir + '/consul-bootstrap-secret-id.txt', errors='ignore') or '(not found)' }}"
      - "  export NOMAD_ADDR=http://{{ hostvars[groups['servers'][0]]['ansible_host'] }}:4646"
      - "  export NOMAD_TOKEN={{ lookup('file', playbook_dir + '/nomad-bootstrap-secret-id.txt', errors='ignore') or '(not found)' }}"
      - ""
      - "Or source the helper script from the ansible/ directory:"
      - "  source ./set-cluster-env.sh"
      - "  source ./unset-cluster-env.sh   # to unset"

  - name: Display completion message
    ansible.builtin.debug:
      msg:
      - "=========================================="
      - "Consul + Nomad (Service Discovery + Workload Identity) Configuration Complete!"
      - "=========================================="
      - ""
      - "Servers configured: {{ groups['servers'] | length }}"
      - "Clients configured: {{ groups['clients'] | length }}"
      - ""
      - "SSH Access to Servers:"
      - "{% for host in groups['servers'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host]['ansible_host'] }}  # {{ host }}{% endfor %}"
      - ""
      - "SSH Access to Clients:"
      - "{% for host in groups['clients'] %}  ssh -o 'IdentitiesOnly=yes' -i ssh_key.pem ubuntu@{{ hostvars[host]['ansible_host'] }}  # {{ host }}{% endfor %}"
      - ""
      - "Access Nomad UI at:"
      - "{% for host in groups['servers'] %}  http://{{ hostvars[host]['ansible_host'] }}:4646{% endfor %}"
      - ""
      - "Access Consul UI at:"
      - "{% for host in groups['servers'] %}  http://{{ hostvars[host]['ansible_host'] }}:8500/ui{% endfor %}"
      - ""
      - "Next steps:"
      - "  1. SSH to a server and verify Nomad cluster: nomad server members"
      - "  2. Verify Consul cluster: consul members"
      - "  3. Check Nomad nodes: nomad node status"
      - "  4. Verify service discovery: consul catalog services"
      - "  5. Deploy a test job: nomad job run example.nomad"
      - "  6. Inspect workload identity JWT auth method: consul acl auth-method list"
